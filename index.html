<title>Business Model Canvas – Frames Creative | Lenice Pereira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf3ec; --ink:#2b2b2b; --muted:#6b6b6b; --coral:#ef6f5b;
    --orange:#f0a05a; --yellow:#f2b234; --green:#4fb87f; --purple:#7b7fe6;
    --red:#e9505a; --blue:#4f9be8; --teal:#3fb48a; --deep:#f07a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
    background-image:radial-gradient(circle at 10% 0%,#ffe6d6 0,transparent 40%),radial-gradient(circle at 100% 100%,#ffe9dc 0,transparent 40%)}
  header{max-width:1400px;margin:0 auto;padding:28px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .eyebrow{font-weight:600;letter-spacing:.08em;font-size:14px;color:#444}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--coral);font-size:clamp(34px,5vw,64px);letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .brand{height:clamp(36px,4.6vw,68px);width:auto;display:block}

  .bar{max-width:1400px;margin:0 auto;padding:8px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{border:0;cursor:pointer;font:500 13px 'Poppins';padding:8px 15px;border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1)}
  .btn.primary{background:var(--coral);color:#fff}
  .btn.dark{background:var(--ink);color:#fff}
  .progress{font-size:12px;color:var(--muted);margin-left:auto}


  .canvas{max-width:1400px;margin:0 auto;padding:14px 24px 40px;display:grid;gap:14px;
    grid-template-columns:repeat(10,1fr);
    grid-template-areas:
      "kp kp ka ka vp vp cr cr cs cs"
      "kp kp kr kr vp vp ch ch cs cs"
      "co co co co co rv rv rv rv rv"}

  /* flip card */
  .block{perspective:1400px;cursor:pointer;min-height:200px}
  .inner{display:grid;height:100%;transition:transform .7s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
  .block.flipped .inner{transform:rotateY(180deg)}
  .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.07)}
  .front{background:var(--c);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:22px;gap:10px;position:relative;transition:transform .25s}
  .block:not(.flipped):hover .front{transform:translateY(-4px)}
  .front svg{width:38px;height:38px}
  .front h3{font-size:20px;font-weight:600;line-height:1.15}
  .front p{font-size:14px;opacity:.92;font-style:italic}
  .front .tap{position:absolute;right:16px;bottom:12px;font-size:11px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:999px}
  .front .n{position:absolute;right:16px;top:14px;font-size:44px;font-weight:700;opacity:.18;line-height:1}
  .back{background:#fff;transform:rotateY(180deg);display:flex;flex-direction:column}
  .back .head{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font-weight:600;font-size:14.5px;background:var(--c)}
  .back .head svg{width:18px;height:18px}
  .back ul{list-style:none;padding:12px 12px 14px;display:flex;flex-direction:column;gap:5px}
  .back li{font-size:13.5px;line-height:1.4;padding:5px 8px 5px 22px;position:relative;border-radius:8px;transition:all .3s}
  .back li::before{content:"";position:absolute;left:8px;top:.85em;width:6px;height:6px;border-radius:50%;background:var(--c)}

  .block{transition:opacity .35s,filter .35s}

  .block.next .front{animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,111,91,.0)}50%{box-shadow:0 0 0 6px rgba(239,111,91,.35)}}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:0 0 30px}
  @media (max-width:900px){
    .canvas{grid-template-columns:1fr 1fr;grid-template-areas:"kp kp" "ka kr" "vp vp" "cr ch" "cs cs" "co co" "rv rv"}
  }
  @media (max-width:560px){.canvas{grid-template-columns:1fr;grid-template-areas:"kp" "ka" "kr" "vp" "cr" "ch" "cs" "co" "rv"}}
</style>
</head>

  {id:'cs',title:'Customer Segments',q:'Who are we creating value for?',color:'var(--blue)',icon:'segments',
   items:['Small business owners and consultants in the Centro region, 25–50 years old','Real estate, restaurants, hotels, beauty and health','People with little time who value quality and professionalism']},
  {id:'co',title:'Cost Structure',q:'Where does the money go?',color:'var(--teal)',icon:'cost',
   items:['Equipment: cameras, drone and microphones','Software and website','Marketing and social media ads','Transport to film at the client\'s location']},
  {id:'rv',title:'Revenue Stream',q:'How does the business make money?',color:'var(--deep)',icon:'revenue',
   items:['Single reels','Monthly packages of 4, 8 or 12 reels','Video scripts','Brand videos for companies','Payment by MB Way or Multibanco']}
];


const svg = (k,s='') => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const canvas = document.getElementById('canvas');
let revealed = new Set();

B.forEach((b,i)=>{
  const el=document.createElement('section');
  el.className='block'; el.dataset.id=b.id; el.style.gridArea=b.id; el.style.setProperty('--c',b.color);
  el.innerHTML=`<div class="inner">
    <div class="face front">${svg(b.icon)}<h3>${b.title}</h3><p>${b.q}</p><span class="tap">click to reveal</span></div>
    <div class="face back"><div class="head">${svg(b.icon)}${b.title}</div>
      <ul>${b.items.map(t=>`<li>${t}</li>`).join('')}</ul></div>
  </div>`;
  el.addEventListener('click',e=>{
    toggle(b.id);
  });
  canvas.appendChild(el);
});

function update(){
  document.querySelectorAll('.block').forEach(el=>el.classList.toggle('flipped',revealed.has(el.dataset.id)));
  const nxt=B.find(b=>!revealed.has(b.id));
  document.querySelectorAll('.block').forEach(el=>el.classList.toggle('next',!!nxt&&el.dataset.id===nxt.id&&revealed.size>0));
  document.getElementById('progress').textContent=`${revealed.size} / ${B.length} revealed`;
  document.getElementById('nextBtn').textContent = nxt ? '▶ Reveal next' : '✓ All revealed';
}
function toggle(id){ revealed.has(id)?revealed.delete(id):revealed.add(id); update(); }
function revealNext(){ const n=B.find(b=>!revealed.has(b.id)); if(n){revealed.add(n.id);update();} }
document.getElementById('nextBtn').onclick=revealNext;
document.getElementById('allBtn').onclick=()=>{B.forEach(b=>revealed.add(b.id));update();};
document.getElementById('resetBtn').onclick=()=>{revealed.clear();update();};
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();revealNext();}
});

update();
</script>
</body>
</html>
